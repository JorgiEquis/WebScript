<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<title>WebScript — falta Visual.render()</title>
</head>
<body>
	<h1>⚠️ Falta una llamada a Visual.render()</h1>
	<p>El fichero <code>contador.wsf</code> no llama a <code>Visual.render(...)</code> en ningún sitio.</p>
	<p>Sin esa llamada no hay ningún <code>visual</code> que montar en la página — declara al menos uno y añade <code>Visual.render(nombreDelVisual)</code> a nivel superior del fichero.</p>
</body>
</html>
